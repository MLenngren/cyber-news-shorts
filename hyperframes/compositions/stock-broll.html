<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06080D; }

    .clip { position: absolute; opacity: 0; }

    video.full {
      left: 50%; top: 50%;
      width: 1080px; height: 1920px;
      object-fit: cover;
      background: #06080D;
    }

    /* Center-stacked chyron */
    #chyron {
      left: 50%; top: 50%;
      width: 980px;
      text-align: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: rgba(255, 255, 255, 0.98);
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.65);
    }
    #chyron .pill {
      display: inline-block;
      padding: 22px 28px;
      border-radius: 26px;
      background: rgba(0, 0, 0, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(10px);
    }
    #chyronText { font-size: 112px; }

    /* CVE full-frame card */
    #cardCve {
      left: 0; top: 0;
      width: 1080px; height: 1920px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(900px 900px at 50% 40%, rgba(43, 120, 255, 0.16), rgba(6, 8, 13, 0.0) 55%),
                  radial-gradient(900px 900px at 50% 70%, rgba(255, 45, 117, 0.10), rgba(6, 8, 13, 0.0) 60%),
                  #06080D;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: rgba(255, 255, 255, 0.98);
    }
    .cveInner { text-align: center; width: 980px; }
    .cveNumber {
      font-size: 140px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.0;
      margin-bottom: 26px;
    }
    .cveMeta {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.08;
      opacity: 0.92;
    }
    .cveMeta .sep { display: block; height: 14px; }

    /* End card */
    #cardEnd {
      left: 0; top: 0;
      width: 1080px; height: 1920px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06080D;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: rgba(255, 255, 255, 0.98);
    }
    .endInner { text-align: center; }
    .endTitle { font-size: 96px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.0; }
    .endSub { margin-top: 16px; font-size: 52px; font-weight: 800; opacity: 0.9; }
    .endSub .accent { color: #7CE2FF; }

    /* Brand badge */
    #brandBadge {
      left: 40px;
      top: 40px;
      opacity: 1;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.98);
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.65);
    }
    #brandBadge .brand-accent { color: #7CE2FF; }
    #brandBadge .live-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #FF3355;
      display: inline-block;
      margin-right: 14px;
      vertical-align: middle;
    }

    /* Bottom ticker */
    #ticker {
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 56px;
      opacity: 1;
      overflow: hidden;
    }
    #ticker .ticker-strip {
      width: 1080px;
      height: 56px;
      display: flex;
      align-items: center;
      padding-left: 40px;
      background: linear-gradient(90deg, rgba(8, 12, 20, 0.92), rgba(124, 226, 255, 0.18));
      border-top: 2px solid rgba(124, 226, 255, 0.45);
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 22px;
      font-weight: 700;
      color: #C0C7CB;
      letter-spacing: 0.12em;
    }

    /* Broadcast scanlines */
    #scanlines {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.0) 0px,
        rgba(255, 255, 255, 0.0) 2px,
        rgba(0, 0, 0, 0.10) 3px,
        rgba(0, 0, 0, 0.10) 4px
      );
      pointer-events: none;
      mix-blend-mode: multiply;
      opacity: 0.45 !important;
    }
  </style>
</head>
<body>

  <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920">

    <!-- Audio (written by scripts/modes/stock_broll.py) -->
    <audio id="master" data-start="0" data-track-index="0" src="master.wav" data-volume="1"></audio>

        <video id="shot1" class="clip full" data-shot="1" data-shot-kind="stock" data-start="0.000" data-duration="5.037" data-track-index="1" src="stock/shot-01.mp4" muted playsinline></video>
    <div id="cardCve" class="clip" data-shot="2" data-start="5.037" data-duration="4.015" data-track-index="10">
      <div class="cveInner">
        <div class="cveNumber" id="cveNumber">CVE-2026-0001</div>
        <div class="cveMeta">
          <div id="cveLineA">AUTH BYPASS</div>
          <div class="sep"></div>
          <div id="cveLineB">INTERNET-FACING</div>
        </div>
      </div>
    </div>
    <video id="hero" class="clip full" data-shot="3" data-shot-kind="ai_hero" data-start="9.052" data-duration="4.573" data-track-index="2" src="ai/hero.mp4" muted playsinline></video>
    <video id="shot4" class="clip full" data-shot="4" data-shot-kind="stock" data-start="13.625" data-duration="4.318" data-track-index="3" src="stock/shot-04.mp4" muted playsinline></video>
    <div id="cardEnd" class="clip" data-shot="5" data-start="17.943" data-duration="1.800" data-track-index="11">
      <div class="endInner">
        <div class="endTitle">THREATNOIR</div>
        <div class="endSub"><span class="accent">//</span> CYBER NEWS</div>
      </div>
    </div>


    <!-- Center-stacked chyron overlay -->
    <div id="chyron" class="clip" data-start="0" data-duration="19.743" data-track-index="20">
      <div class="pill"><span id="chyronText">&nbsp;</span></div>
    </div>

    <!-- Format chrome -->
    <div id="brandBadge" class="clip" data-start="0" data-duration="19.743" data-track-index="50">
      <span class="live-dot"></span>
      <span class="brand-text">THREATNOIR <span class="brand-accent">// CYBER NEWS</span></span>
    </div>

    <div id="ticker" class="clip" data-start="0" data-duration="19.743" data-track-index="51">
      <div class="ticker-strip">
        <span>THREATNOIR · CYBER NEWS · </span>
        <span>PATCH FIRST · COFFEE SECOND · </span>
        <span>THE WINDOW IS CLOSING · </span>
        <span>THREATNOIR · CYBER NEWS · </span>
        <span>WEEKS → DAYS → STAND-UP · </span>
        <span>THREATNOIR · CYBER NEWS · </span>
      </div>
    </div>

    <div id="scanlines" class="clip" data-start="0" data-duration="19.743" data-track-index="52"></div>

  </div>

  <script>
    function loadJSON(path) {
      const xhr = new XMLHttpRequest();
      xhr.open("GET", path, false);
      xhr.send(null);
      if (xhr.status >= 200 && xhr.status < 300) return JSON.parse(xhr.responseText);
	    throw new Error("Failed to load " + path + ": " + xhr.status);
    }

    const tl = gsap.timeline({ paused: true });

    const chyron = document.getElementById("chyron");
    const chyronText = document.getElementById("chyronText");

    const cardCve = document.getElementById("cardCve");
    const cardEnd = document.getElementById("cardEnd");
    const cveNumber = document.getElementById("cveNumber");
    const cveLineA = document.getElementById("cveLineA");
    const cveLineB = document.getElementById("cveLineB");

    const videos = Array.from(document.querySelectorAll("video.full"));

    // Centering: use GSAP xPercent/yPercent (avoid CSS transforms so tweens stay centered).
    gsap.set(videos, { xPercent: -50, yPercent: -50 });
    gsap.set(chyron, { xPercent: -50, yPercent: -50 });

    // Inputs (written by scripts/modes/stock_broll.py)
    let manifest = { total_duration: 40, shots: [] };
    try { manifest = loadJSON("manifest.json"); } catch (e) { /* defaults */ }
    const shots = Array.isArray(manifest.shots) ? manifest.shots : [];
    const total = Number(manifest.total_duration || 40);

    const hide = [...videos];
    if (cardCve) hide.push(cardCve);
    if (cardEnd) hide.push(cardEnd);
    hide.push(chyron);
    gsap.set(hide, { opacity: 0 });

    // Chrome: finite, deterministic animations (capture-safe)
    const liveDot = document.querySelector("#brandBadge .live-dot");
    if (liveDot) {
      // Keep this finite (capture-safe) and do not extend beyond the composition duration.
      const repeats = Math.max(0, Math.floor(total / 0.8) - 1);
      tl.to(
        liveDot,
        { opacity: 0.3, yoyo: true, repeat: repeats, duration: 0.8, ease: "sine.inOut" },
        0
      );
    }
    const tickerStrip = document.querySelector("#ticker .ticker-strip");
    if (tickerStrip) {
      const tickerDistance = 2400;
      tl.fromTo(
        tickerStrip,
        { x: 0 },
        { x: -tickerDistance, duration: Math.max(8, total * 0.9), ease: "none" },
        0
      );
    }

    function bindVideo(el, shot) {
      if (!el) return;
      tl.set(el, { opacity: 1 }, shot.start);
      tl.set(el, { opacity: 0 }, shot.start + shot.duration);
    }

    function bindCard(el, shot) {
      if (!el) return;
      tl.set(el, { opacity: 1 }, shot.start);
      tl.set(el, { opacity: 0 }, shot.start + shot.duration);
    }

    function bindChyron(text, start, duration) {
      const s = Number(start);
      const d = Number(duration);
      tl.call(() => { chyronText.textContent = text || ""; }, null, s);
      tl.fromTo(
        chyron,
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.18, ease: "power2.out", overwrite: "auto" },
        s
      );
      tl.to(
        chyron,
        { opacity: 0, duration: 0.08, ease: "none", overwrite: "auto" },
        Math.max(s, s + d - 0.08)
      );
    }

    function elForShot(shot) {
      const n = Number(shot.shot);
      if (!Number.isFinite(n)) return null;
	    return document.querySelector('[data-shot="' + n + '"]');
    }

    for (const shot of shots) {
      const kind = String(shot.kind || "");
      if (kind === "stock" || kind === "ai_hero") {
        const el = elForShot(shot);
        bindVideo(el, shot);
        bindChyron(String(shot.chyron || ""), shot.start, shot.duration);
      } else if (kind === "card_cve") {
        if (cveNumber) cveNumber.textContent = String(shot.cve || "CVE");
        if (cveLineA) cveLineA.textContent = String(shot.line_a || "");
        if (cveLineB) cveLineB.textContent = String(shot.line_b || "");
        bindCard(cardCve, shot);
      } else if (kind === "card_end") {
        const el = elForShot(shot) || cardEnd;
        bindCard(el, shot);
      }
    }

    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>

</body>
</html>
